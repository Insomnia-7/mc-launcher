name: Release

# 触发：push 一个 v* tag（例如 v0.3.0），或者手工重跑一个「已经存在」的 tag。
# 流水线：发布主程序（WPF）+ 更新器 → 生成 update.json → 传成 GitHub Release 资产。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已经存在，例如 v0.3.0）'
        required: true
        type: string
      notes:
        description: '更新说明，写进 update.json 的 notes；留空则用 MCLauncher <version>'
        required: false
        type: string

# 传 Release 必须：contents: write
permissions:
  contents: write

# 同一个 tag 别并发发两次
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  release:
    runs-on: windows-latest
    environment: release-signing

    # 代码签名用的 secret 不放在 job 级：job env 会注入到每个 step（包括第三方
    # action）的环境里，等于把 PFX 交给整条流水线。改成「检测步骤 + 签名步骤」
    # 各自挂 env，暴露面从 14 步缩到 2 步。
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 解析 tag 与版本号
        id: version
        shell: pwsh
        env:
          RAW_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:RAW_TAG".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host '::error::没有可发布的 tag（tag 触发或 workflow_dispatch 的 tag 输入都为空）'
            exit 1
          }
          $version = $tag
          if ($version -match '^[vV]') { $version = $version.Substring(1) }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw 'tag 必须为 v 主版本.次版本.补丁版本，可带预发布后缀' }
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Host '::error::从 tag 里解析出的版本号为空'
            exit 1
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Write-Host "tag=$tag version=$version"

      - name: 构建与回归检查
        shell: pwsh
        run: |
          dotnet build mc-launcher/MinecraftLauncher.sln -c Release -m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet mc-launcher/tests/Core.Checks/bin/Release/net10.0/Core.Checks.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet mc-launcher/tests/Architecture.Check/bin/Release/net10.0/Architecture.Check.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet mc-launcher/tests/App.Checks/bin/Release/net10.0-windows/App.Checks.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 先判断这次有没有证书。判断结果落成 output，签名步骤靠它开关；
      # 没证书时打一条 warning，免得「静默跳过」导致发布完才发现没签。
      - name: 检测代码签名凭据
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host '::warning::没有配置 CODE_SIGNING_PFX_BASE64，本次发布不签名（SmartScreen 会提示未知发布者）'
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host '检测到代码签名证书，本次发布会签名'
          }

      - name: 发布更新器
        shell: pwsh
        run: |
          dotnet publish mc-launcher/tools/Launcher.Updater `
            -c Release `
            -o payload/updater `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 签名内嵌更新器（可选）
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.CODE_SIGNING_TIMESTAMP_URL }}
        run: |
          pwsh -NoProfile -File scripts/sign-windows-executable.ps1 -Path payload/updater/mclupd.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 发布主程序（WPF）
        shell: pwsh
        run: |
          dotnet publish mc-launcher/src/Launcher.App `
            -c Release `
            -o out `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            "-p:UpdaterPayload=$((Resolve-Path payload/updater/mclupd.exe).Path)" `
            "-p:FileVersion=$(('${{ steps.version.outputs.version }}').Split('-')[0]).0" `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:ContinuousIntegrationBuild=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 签名主程序（可选）
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.CODE_SIGNING_TIMESTAMP_URL }}
        run: |
          pwsh -NoProfile -File scripts/sign-windows-executable.ps1 -Path out/MCLauncher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 验证单文件发布布局
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'MCLauncher.exe') { throw '发布目录必须只有 MCLauncher.exe' }

      # Release 资产是拍平的：一旦 out/** 里出现两个同名文件，上传就会互相覆盖/报 422。
      # 这里提前拦住，别等传到一半才炸。
      - name: 检查资产名唯一
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $groups = Get-ChildItem out -Recurse -File |
            Where-Object { $_.Extension -ne '.pdb' -and $_.Name -ne 'update.json' } |
            Group-Object Name |
            Where-Object Count -gt 1
          if ($groups) {
            foreach ($g in $groups) {
              $where = ($g.Group | ForEach-Object { $_.FullName }) -join ' / '
              Write-Host "::error::资产名重复：$($g.Name) ← $where"
            }
            exit 1
          }
          Write-Host 'out/** 里的文件名互不重复，可以按拍平资产上传'

      # 便携版整包：winget / Scoop 这类包管理器要一个 zip，普通用户也更好下载。
      # 故意放到 dist/ 而不是 out/ —— out/ 是更新清单的扫描目录，把 zip 放进去会让
      # 更新器把「整包 zip」当成一个要替换的文件，每次更新都重下 40 MB。
      # 所以这一步必须排在「生成 update.json」之前、且产物落在 out/ 之外。
      - name: 打包便携版 zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/MCLauncher-$($env:VERSION)-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path out '*') -DestinationPath $zip -CompressionLevel Optimal
          $size = (Get-Item $zip).Length
          # 别写死 1MB：这版产物压出来只有 ~0.91MB，写死下限会在首次发布就把流水线打断。
          # 跟源体积比更抗未来瘦身，也能抓住「只打进几个文件」的打包失败。
          $source = (Get-ChildItem out -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "$zip $size bytes（源 $source bytes）"
          if ($size -lt 0.25 * $source) { throw "便携包太小（$size / 源 $source bytes），八成打包失败" }

      # GitHub Release 会把资产名拍平（out/updater/mclupd.exe 变成资产 mclupd.exe），
      # 所以这里必须带 -FlattenAssetUrls，否则 updater/mclupd.exe 的下载地址会 404。
      - name: 生成 update.json
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RAW_NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = if ([string]::IsNullOrWhiteSpace($env:RAW_NOTES)) { "MCLauncher $($env:VERSION)" } else { $env:RAW_NOTES }
          $baseUrl = "https://github.com/$($env:REPOSITORY)/releases/download/$($env:TAG)"
          Write-Host "baseUrl=$baseUrl"
          pwsh -NoProfile -File scripts/make-update-manifest.ps1 `
            -Directory out `
            -Version $env:VERSION `
            -Notes $notes `
            -BaseUrl $baseUrl `
            -FlattenAssetUrls `
            -OutFile out/update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 传上去之前先按更新器的规矩自检一遍，免得发出一份客户端根本吃不了的清单
      - name: 校验 update.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath out/update.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.version)) { throw 'update.json 缺少 version' }
          $files = @($manifest.files)
          if ($files.Count -eq 0) { throw 'update.json 里没有任何文件' }

          foreach ($file in $files) {
            if ($file.path -match '(\.\.|:)' -or $file.path.StartsWith('/') -or $file.path.Contains('\')) {
              throw "update.json 里的 path 不是安全相对路径：$($file.path)"
            }
            if ($file.path -ieq 'update.json') { throw 'update.json 把自己也写进 files 了' }
            if ($file.path -like '*.pdb' -or $file.path -like '*.log') { throw "不该被收录的文件进了清单：$($file.path)" }
            if ($file.sha256 -notmatch '^[0-9a-f]{64}$') { throw "sha256 不是 64 位小写 hex：$($file.path)" }
            if ([string]::IsNullOrWhiteSpace($file.url)) { throw "url 为空：$($file.path)" }
            if ($file.size -le 0) { throw "size 不正常：$($file.path) = $($file.size)" }
          }

          if ($files.Count -ne 1 -or $files[0].path -ne 'MCLauncher.exe') {
            throw '单文件更新清单必须且只能包含 MCLauncher.exe'
          }

          Write-Host "清单 OK：$($files.Count) 个文件，版本 $($manifest.version)"
          Write-Host "主程序 url 示例：$($files[0].url)"

      - name: 签名更新清单
        shell: pwsh
        env:
          MCLAUNCHER_UPDATE_SIGNING_KEY: ${{ secrets.MCLAUNCHER_UPDATE_SIGNING_KEY }}
        run: |
          pwsh -NoProfile -File scripts/update-signing.ps1 -ManifestPath out/update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 独立验证发布签名
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/update-signing.ps1 -ManifestPath out/update.json -VerifyOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MCLauncher ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            out/**
            dist/*.zip